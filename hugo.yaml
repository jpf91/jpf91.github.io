baseURL: https://jpfau.org/
languageCode: en-us
title: JP's Techblog
theme:
  - hugo-shortcode-roneo-collection
  - PaperMod
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
pluralizelisttitles: false
mainsections: ["blog"]

frontmatter:
  date:
    - ':filename'
    - ':default'

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Series
          url: series/
          weight: 5
        - name: Archive
          url: archive/
          weight: 5
        - name: Search
          url: search/
          weight: 10
        - name: Tags
          url: tags/
          weight: 10

module:
  imports:
  - path: github.com/privatemaker/headless-cms
  - path: github.com/hugomods/katex

outputs:
  home:
  - HTML
  - RSS
  - JSON
  - HeadlessCMSConfig

params:
  env: production
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  comments: true

  homeInfoParams:
    Title: "Johannes Pfau"
    Content: >
      Blogging about all things tech, software, hardware and IT stuff.
  socialIcons:
    - name: github
      title: Github
      url: "https://github.com/jpf91"
    - name: LinkedIn
      title: LinkedIn
      url: "https://linkedin.com/in/johannes-pfau-a3963b277"
    - name: ORCID
      title: ORCID
      url: "https://orcid.org/0000-0003-1087-1814"

  headless_cms:
    engine: "decap"
    site_url: "https://jpfau.org"
    backend:
      name: "github"
      repo: "jpf91/jpf91.github.io"
      base_url: https://bauth.mbh4.de/
    collections:
      blog:
        label: "Blog"
        name: "blog"
        folder: "content/blog"
        create: true
        slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Authors"
            name: "author"
            widget: "list"
            field:
              label: "Name"
              name: "name"
              widget: "string"
          - label: "Description"
            name: "description"
            widget: "string"
          - label: "Tags"
            name: "tags"
            widget: "list"
          - label: "Show TOC"
            name: "ShowToc"
            widget: "boolean"
          - label: "Draft"
            name: "draft"
            widget: "boolean"
          - label: "Series"
            name: "series"
            widget: "list"
            field:
              label: "Name"
              name: "name"
              widget: "string"
          - label: "Body"
            name: "body"
            widget: "markdown"
